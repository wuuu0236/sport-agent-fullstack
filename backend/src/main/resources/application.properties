server.port=8080
spring.application.name=sport-agent-backend

# 上传限制：Spring Boot 默认 max-file-size=1MB，手机训练截图普遍 2~6MB，
# 不调大会直接 MaxUploadSizeExceededException（真实回归 bug）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Python agent-service 地址与鉴权 token（与 agent-service/.env 的 AGENT_AUTH_TOKEN
# 保持一致；留空 = 不带鉴权头。改完需 mvn clean package 重新打包）
agent.service.base-url=http://127.0.0.1:8001
agent.service.token=
