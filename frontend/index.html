<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1015" />
    <meta name="description" content="战狼养成计划 · 本地优先的体育训练助理：训练记录、数据分析、周期计划与多 Agent 编排" />
    <title>战狼养成计划 · 训练助理</title>
    <!-- 首屏底色：按已保存的明暗预设上色，避免加载瞬间闪成反色 -->
    <style>
      html,
      body {
        margin: 0;
        background: #0d1015;
        color: #eaeff7;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #e8ecf2;
        color: #141a24;
      }
    </style>
    <script>
      // 在样式生效前把明暗写到 <html>；与 utils/wallpaper.ts 的存储键保持一致
      ;(function () {
        try {
          var t = localStorage.getItem('sport-theme')
          document.documentElement.setAttribute(
            'data-theme',
            t === 'light' ? 'light' : 'dark'
          )
        } catch (e) {
          /* 隐私模式下 localStorage 不可用，退回深色 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
